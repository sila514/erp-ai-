name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp_user
          POSTGRES_PASSWORD: erp_pass
          POSTGRES_DB: erp_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp_user -d erp_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://erp_user:erp_pass@localhost:5432/erp_db
      TEST_DATABASE_URL: postgresql://erp_user:erp_pass@localhost:5432/erp_db
      SECRET_KEY: ci-test-secret
      ANTHROPIC_API_KEY: ci-test-key
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Migration'ı gerçek Postgres'e uygula
        run: alembic upgrade head

      - name: pytest
        run: pytest -v

  ml-service-smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml_service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml_service/requirements.txt

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Import sağlığı (bu serviste pytest suite'i kapsam dışı)
        run: python -c "import app.main"

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (tsc + vite)
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, ml_service, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: ${{ matrix.service }} imajını build et
        run: docker build -t erp-ai-${{ matrix.service }}:ci ./${{ matrix.service }}
